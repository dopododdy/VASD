<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บริการลูกค้า - หน่วยบริการวิชา VET RMUTTO</title>
    <!-- ใช้ Google Font 'Sarabun' สำหรับภาษาไทย -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Sarabun', sans-serif; 
            background-color: #f0f4f8; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }
        .container { 
            background: #ffffff; 
            width: 100%; 
            max-width: 360px; /* ขนาดเหมาะกับหน้าจอมือถือ */
            padding: 40px 25px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
            text-align: center; 
            box-sizing: border-box;
            margin: 20px;
        }
        .logo-icon {
            font-size: 3.5rem;
            margin-bottom: 10px;
        }
        h1 { 
            color: #1e293b; 
            font-size: 1.4rem; 
            margin-bottom: 8px; 
            font-weight: 600;
        }
        p.subtitle { 
            color: #64748b; 
            margin-bottom: 35px; 
            font-size: 0.95rem;
        }
        .menu-btn { 
            display: flex; 
            align-items: center;
            justify-content: center;
            width: 100%; 
            padding: 16px; 
            margin-bottom: 16px; 
            border-radius: 12px; 
            text-decoration: none; 
            font-size: 1.1rem; 
            font-weight: 600; 
            transition: transform 0.2s, box-shadow 0.2s; 
            box-sizing: border-box; 
        }
        .menu-btn:active {
            transform: scale(0.98);
        }
        .btn-primary { 
            background-color: #3b82f6; 
            color: white; 
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
        .btn-primary:hover { 
            background-color: #2563eb; 
        }
        .btn-secondary { 
            background-color: #10b981; 
            color: white; 
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
        .btn-secondary:hover { 
            background-color: #059669; 
        }
        .icon { 
            margin-right: 12px; 
            font-size: 1.3rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-icon">🐾</div>
        <h1>หน่วยบริการวิชาการ VET RMUTTO</h1>
        <p class="subtitle">กรุณาเลือกบริการที่ท่านต้องการ</p>

        <!-- เมนู 1: ติดตามคิวผ่าตัด -->
        <a href="customer.html" class="menu-btn btn-primary">
            <span class="icon">🩺</span> ติดตามคิวผ่าตัด
        </a>
        
        <!-- เมนู 2: แบบสำรวจการให้บริการ -->
        <a href="feedback.html" class="menu-btn btn-secondary">
            <span class="icon">📝</span> แบบสำรวจการให้บริการ
        </a>
    </div>
</body>
</html>
