<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>โต๊ะจัดยา – VASD</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Sarabun:wght@300;400;500;600;700&family=Prompt:wght@400;600&family=Kanit:wght@400;600&display=swap" rel="stylesheet">

<!-- Script สำหรับเช็ค Theme ก่อนเรนเดอร์หน้าเว็บเพื่อป้องกันการกระพริบ (FOUC) -->
<script>
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'light' || (!savedTheme && window.matchMedia('(prefers-color-scheme: light)').matches)) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
</script>

<style>
/* ═══════════════════════════════════════════
   TOKENS & BASE (Dark Mode - Default)
═══════════════════════════════════════════ */
:root {
  --navy:          #0b1929;
  --navy-mid:      #112240;
  --sky:           #0ea5e9; 
  --sky-light:     #38bdf8;
  --teal:          #0ea5a0;
  --emerald:       #10b981;
  --violet:        #8b5cf6;
  --rose:          #ef4444;
  --amber:         #f59e0b;

  --surface:    rgba(255,255,255,0.04);
  --surface-2:  rgba(255,255,255,0.07);
  --surface-3:  rgba(255,255,255,0.11);
  --border:     rgba(255,255,255,0.08);
  --border-2:   rgba(255,255,255,0.14);
  
  --text:       #e2e8f0;
  --text-dim:   #94a3b8;
  --text-faint: #4a5568;
  --text-heading: #ffffff;

  --radius-sm: 10px;
  --radius-lg: 22px;
}

/* ═══════════════════════════════════════════
   LIGHT THEME TOKENS
═══════════════════════════════════════════ */
[data-theme="light"] {
  --navy:       #f8fafc;
  --navy-mid:   #ffffff;
  --surface:    #ffffff;
  --surface-2:  #f1f5f9;
  --surface-3:  #e2e8f0;
  --border:     #e2e8f0;
  --border-2:   #cbd5e1;
  
  --text:       #0f172a;
  --text-dim:   #475569;
  --text-faint: #64748b;
  --text-heading: #0f172a;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Sarabun", sans-serif;
  background: var(--navy); color: var(--text);
  min-height: 100vh; display: flex; flex-direction: column;
  overflow-x: hidden; padding-bottom: 100px;
  transition: background-color 0.3s ease, color 0.3s ease;
}

header {
  position: sticky; top: 0; z-index: 200;
  background: rgba(11,25,41,0.88); backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 15px 20px; display: flex; align-items: center; justify-content: space-between;
  transition: background-color 0.3s ease, border-color 0.3s ease;
}
[data-theme="light"] header {
  background: rgba(255,255,255,0.88);
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-logo {
  width: 38px; height: 38px;
  background: linear-gradient(135deg, var(--sky), var(--sky-light));
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
  font-size: 18px; box-shadow: 0 0 20px rgba(14, 165, 233, 0.3);
}
.brand-name { font-family: "Outfit", sans-serif; font-size: 16px; font-weight: 700; color: var(--text-heading); line-height: 1; transition: color 0.3s; }
.brand-sub { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

/* Theme Toggle Button & Header Actions */
.header-actions { display: flex; gap: 12px; align-items: center; }
.btn-theme {
  background: var(--surface-2); border: 1px solid var(--border-2); color: var(--text);
  width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 14px; transition: background 0.2s, transform 0.2s;
}
.btn-theme:hover { background: var(--surface-3); transform: scale(1.05); }
.btn-theme:active { transform: scale(0.95); }
.icon-sun { display: none; }
[data-theme="light"] .icon-moon { display: none; }
[data-theme="light"] .icon-sun { display: inline-block; }

.badge-count {
  background: rgba(14, 165, 233, 0.15); border: 1px solid rgba(14, 165, 233, 0.3);
  color: var(--sky-light); font-size: 12px; font-weight: 600;
  padding: 6px 14px; border-radius: 20px;
}
[data-theme="light"] .badge-count { color: var(--sky); font-weight: 700; }

.wrap { max-width: 800px; margin: 0 auto; padding: 20px 16px; width: 100%; }

/* ═══════════════════════════════════════════
   RX CARD
═══════════════════════════════════════════ */
.rx-card {
  background: var(--surface); border: 1px solid var(--border-2);
  border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 16px;
  animation: slideUp 0.4s ease both;
  transition: background-color 0.3s, border-color 0.3s, box-shadow 0.3s;
}
[data-theme="light"] .rx-card { box-shadow: 0 4px 15px rgba(0,0,0,0.03); }

.card-header {
  display: flex; align-items: center; gap: 12px; padding: 16px;
  border-bottom: 1px solid var(--border); background: var(--surface-2);
  transition: background-color 0.3s, border-color 0.3s;
}
.q-circle {
  font-family: "Outfit", sans-serif; width: 46px; height: 46px; border-radius: 50%;
  background: var(--sky); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 800; flex-shrink: 0;
  box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
}
.sc-title-block { flex: 1; }
.sc-animal-name { font-family: "Outfit", sans-serif; font-size: 18px; font-weight: 800; color: var(--text-heading); transition: color 0.3s; }
.sc-meta { font-size: 12px; color: var(--text-dim); margin-top: 4px; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }

.rx-list-container { padding: 16px; }
.rx-list-title { font-size: 12px; font-weight: 700; color: var(--text-dim); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }

.rx-item {
  display: flex; gap: 12px; background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 14px; margin-bottom: 10px; align-items: center; flex-wrap: wrap;
  transition: background-color 0.3s, border-color 0.3s;
}
.rx-idx {
  width: 24px; height: 24px; border-radius: 50%; background: rgba(255,255,255,0.1);
  display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: var(--text-dim);
  flex-shrink: 0; align-self: flex-start;
  transition: background-color 0.3s;
}
[data-theme="light"] .rx-idx { background: rgba(0,0,0,0.05); }

.rx-details { flex: 1; min-width: 200px;}
.rx-name { font-size: 15px; font-weight: 700; color: var(--text-heading); margin-bottom: 6px; transition: color 0.3s; }
.rx-desc { font-size: 13px; color: var(--text-dim); margin-bottom: 2px; }
.rx-desc b { color: var(--sky-light); }
[data-theme="light"] .rx-desc b { color: var(--sky); }

.service-item {
  background: rgba(245, 158, 11, 0.1); border: 1px dashed rgba(245, 158, 11, 0.3);
  color: var(--amber); padding: 10px 14px; border-radius: 8px; margin-bottom: 8px; font-size: 14px; font-weight: 500;
}
[data-theme="light"] .service-item { color: #d97706; }

/* Edit Inputs in Rx */
.edit-input {
  background: var(--navy); border: 1px solid var(--border-2); color: var(--text);
  padding: 4px 8px; border-radius: 4px; font-family: "Sarabun", sans-serif; font-size: 13px;
  width: 100%; margin-bottom: 4px; outline: none; transition: background-color 0.3s, border-color 0.3s, color 0.3s;
}
[data-theme="light"] .edit-input { background: #ffffff; color: var(--text-heading); }
.edit-input:focus { border-color: var(--sky-light); }

.rx-actions { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
.btn-action-single {
  background: rgba(14, 165, 233, 0.1); border: 1px solid var(--sky);
  color: var(--sky-light); border-radius: 8px; padding: 6px 12px;
  cursor: pointer; font-size: 12px; font-weight: 600; font-family: "Sarabun", sans-serif;
  transition: 0.2s; white-space: nowrap; width: 100%; text-align: center;
}
[data-theme="light"] .btn-action-single { color: var(--sky); }
.btn-action-single:hover { background: var(--sky); color: #fff; }
.btn-action-single.edit { background: rgba(245, 158, 11, 0.1); border-color: var(--amber); color: var(--amber); }
[data-theme="light"] .btn-action-single.edit { color: #d97706; }
.btn-action-single.edit:hover { background: var(--amber); color: #fff; }
.btn-action-single.save { background: rgba(16, 185, 129, 0.1); border-color: var(--emerald); color: var(--emerald); }
[data-theme="light"] .btn-action-single.save { color: #059669; }
.btn-action-single.save:hover { background: var(--emerald); color: #fff; }

.card-footer {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  padding: 16px; background: var(--surface-2); border-top: 1px solid var(--border);
  transition: background-color 0.3s, border-color 0.3s;
}
.card-actions {
  grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px;
}
@media (max-width: 500px) { .card-footer { grid-template-columns: 1fr; } }

.btn {
  padding: 12px 16px; font-size: 14px; font-weight: 600; font-family: "Sarabun", sans-serif;
  border: none; border-radius: var(--radius-sm); cursor: pointer; text-align: center; transition: 0.2s;
}
.btn-sky { background: rgba(14, 165, 233, 0.15); color: var(--sky-light); border: 1px solid rgba(14, 165, 233, 0.3); }
[data-theme="light"] .btn-sky { color: var(--sky); }
.btn-sky:hover { background: rgba(14, 165, 233, 0.25); }
.btn-emerald { background: linear-gradient(135deg, var(--emerald), #34d399); color: #fff; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25); }
.btn-emerald:hover { opacity: 0.9; transform: translateY(-1px); }
.btn-sm { padding: 8px 12px; font-size: 12px; background: var(--surface); border: 1px solid var(--border-2); color: var(--text); border-radius: 8px; cursor: pointer; transition: background-color 0.3s, border-color 0.3s, color 0.3s; }
[data-theme="light"] .btn-sm { background: #ffffff; }
.btn-sm:hover { background: var(--surface-2); }

/* ═══════════════════════════════════════════
   BOTTOM NAV
═══════════════════════════════════════════ */
.bottom-nav {
  display: grid; position: fixed; bottom: 0; left: 0; right: 0; z-index: 300;
  background: rgba(11,25,41,0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--border-2);
  padding: 8px 0 max(8px, env(safe-area-inset-bottom));
  grid-template-columns: repeat(5, 1fr);
  transition: background-color 0.3s ease;
}
[data-theme="light"] .bottom-nav { background: rgba(255,255,255,0.95); }

.nav-item {
  display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 4px;
  font-size: 9px; color: var(--text-dim); text-decoration: none; transition: color 0.2s;
}
.nav-item.active { color: var(--teal); }
.nav-icon { font-size: 21px; line-height: 1; }

@keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-logo">💊</div>
    <div>
      <div class="brand-name">โต๊ะจัดยา (Pharmacy)</div>
      <div class="brand-sub">จ่ายยา บริการ และให้คำแนะนำ</div>
    </div>
  </div>
  <div class="header-actions">
    <!-- ปุ่ม Toggle สลับ Theme -->
    <button id="themeToggle" class="btn-theme" title="สลับโหมดมืด/สว่าง">
      <span class="icon-moon">🌙</span>
      <span class="icon-sun">☀️</span>
    </button>
    <div class="badge-count" id="count-badge">0 รอจัดยา</div>
  </div>
</header>

<div class="wrap" id="rx-container">
  <div style="text-align: center; color: var(--text-dim); padding: 40px;">กำลังโหลดข้อมูล...</div>
</div>

<nav class="bottom-nav">
  <a class="nav-item" href="index.html"><span class="nav-icon">🏠</span>หน้าหลัก</a>
  <a class="nav-item" href="animals.html"><span class="nav-icon">🐾</span>สัตว์</a>
  <a class="nav-item" href="anesthesia.html"><span class="nav-icon">💉</span>วางยา</a>
  <a class="nav-item" href="surgery.html"><span class="nav-icon">🛏️</span>ผ่าตัด</a>
  <a class="nav-item" href="recovery.html"><span class="nav-icon">❤️‍🩹</span>พักฟื้น</a>
</nav>

<script>
  /* ── Theme Switcher Logic ── */
  const themeToggleBtn = document.getElementById('themeToggle');
  if (themeToggleBtn) {
    themeToggleBtn.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      if (currentTheme === 'light') {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('theme', 'dark');
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        localStorage.setItem('theme', 'light');
      }
    });
  }
</script>

<script type="module">
import { supabase } from "./js/supabase.js";

window.rxDataMap = {}; 

// ฟังก์ชันจัดการวันที่ (ปรับปรุงเป็นรูปแบบ พ.ศ. ภาษาไทยเต็มรูปแบบ)
const getDates = () => {
  const now = new Date();
  const next7 = new Date(); next7.setDate(now.getDate() + 7);
  
  const options = { 
    day: 'numeric', 
    month: 'long', 
    year: 'numeric' 
  };
  
  const fmt = (d) => d.toLocaleDateString('th-TH', options); 
  
  return { 
    today: fmt(now), 
    next: fmt(next7) 
  };
};

async function loadRxQueue() {
  const container = document.getElementById("rx-container");
  
  try {
    const { data: queueData, error } = await supabase
      .from("vasd_queue")
      .select(`
        id, animal_id, status, 
        vasd_animal(id, queue_number, animal_name, species, sex, actual_weight,
          vasd_owner(owner_name, id_card, address, phone),
          vasd_prescription(*),
          vasd_service(*)
        )
      `)
      .in("status", ["surgery", "recovery", "ready_to_go_home"])
      .order("updated_at", { ascending: true });

    if (error) throw error;

    const animals = (queueData || []).filter(q => {
      if (!q.vasd_animal) return false;
      const hasRx = q.vasd_animal.vasd_prescription && q.vasd_animal.vasd_prescription.length > 0;
      const hasService = q.vasd_animal.vasd_service && q.vasd_animal.vasd_service.length > 0;
      return hasRx || hasService || q.status === "ready_to_go_home";
    });
    
    if (animals.length === 0) {
      document.getElementById("count-badge").innerText = "0 รอจัดยา";
      container.innerHTML = `<div style="text-align:center; padding: 60px 20px; color: var(--text-dim);">✅ ไม่มีคิวรอจัดยาในขณะนี้</div>`;
      return;
    }

    document.getElementById("count-badge").innerText = `${animals.length} รอจัดยา`;
    container.innerHTML = "";
    window.rxDataMap = {};

    animals.forEach(q => {
      const a = q.vasd_animal;
      const ownerName = a.vasd_owner?.owner_name || "-";
      window.rxDataMap[a.id] = a; 
      
      let rxHtml = "";
      if (a.vasd_prescription && a.vasd_prescription.length > 0) {
        rxHtml = a.vasd_prescription.map((rx, i) => `
          <div class="rx-item" id="rx-item-${rx.id}">
            <div class="rx-idx">${i + 1}</div>
            
            <!-- โหมดแสดงผลปกติ -->
            <div class="rx-details" id="rx-view-${rx.id}">
              <div class="rx-name">${rx.drug_id}</div>
              <div class="rx-desc">วิธีใช้: ป้อน <b>${rx.dose}</b> · ${rx.freq}</div>
              <div class="rx-desc">จำนวนที่จ่าย: <b>${rx.total_pills}</b> เม็ด</div>
              ${rx.days ? `<div class="rx-desc">สำหรับ <b>${rx.days}</b> วัน</div>` : ''}
            </div>

            <!-- โหมดแก้ไข (ซ่อนไว้ก่อน) -->
            <div class="rx-details" id="rx-edit-${rx.id}" style="display:none;">
              <input type="text" id="edit-name-${rx.id}" class="edit-input" value="${rx.drug_id}" placeholder="ชื่อยา">
              <div style="display:flex; gap:4px;">
                <input type="text" id="edit-dose-${rx.id}" class="edit-input" value="${rx.dose}" placeholder="ปริมาณ (เช่น 1 เม็ด)" style="flex:1;">
                <input type="text" id="edit-freq-${rx.id}" class="edit-input" value="${rx.freq}" placeholder="ความถี่" style="flex:2;">
              </div>
              <div style="display:flex; gap:4px;">
                <input type="text" id="edit-total-${rx.id}" class="edit-input" value="${rx.total_pills}" placeholder="จำนวนรวม (ตัวเลข)" style="flex:1;">
                <input type="text" id="edit-days-${rx.id}" class="edit-input" value="${rx.days || ''}" placeholder="จำนวนวัน" style="flex:1;">
              </div>
            </div>

            <div class="rx-actions">
              <button class="btn-action-single" id="btn-print-${rx.id}" onclick="printSingleRx('${a.id}', ${i})">🖨️ สติกเกอร์</button>
              <button class="btn-action-single edit" id="btn-edit-${rx.id}" onclick="editRx('${rx.id}')">✏️ แก้ไข</button>
              <button class="btn-action-single save" id="btn-save-${rx.id}" style="display:none;" onclick="saveEditedRx('${rx.id}')">💾 บันทึก</button>
            </div>
          </div>
        `).join('');
      } else {
        rxHtml = `<div style="color:var(--text-dim); font-size:13px; text-align:center; padding:15px; background:var(--surface-2); border-radius:10px;">ไม่มีการสั่งจ่ายยา</div>`;
      }

      // เช็คบริการ
      let serviceHtml = "";
      let hasVaccine = false;
      let hasMicrochip = false;

      if (a.vasd_service && a.vasd_service.length > 0) {
        serviceHtml += `<div class="rx-list-title" style="margin-top:20px;">บริการที่ได้รับ</div>`;
        a.vasd_service.forEach(t => {
          const tName = t.service_type || "บริการทั่วไป";
          serviceHtml += `<div class="service-item">✨ ${tName}</div>`;
          if (tName.includes("วัคซีน")) hasVaccine = true;
          if (tName.includes("ไมโครชิพ") || tName.includes("ไมโครชิป")) hasMicrochip = true;
        });
      }

      let statusBadge = "";
      if (q.status === 'surgery') statusBadge = '<span style="background:var(--rose); color:#fff; padding:2px 6px; border-radius:6px; font-size:10px;">กำลังผ่าตัด</span>';
      else if (q.status === 'recovery') statusBadge = '<span style="background:var(--violet); color:#fff; padding:2px 6px; border-radius:6px; font-size:10px;">กำลังพักฟื้น</span>';
      else if (q.status === 'ready_to_go_home') statusBadge = '<span style="background:var(--emerald); color:#fff; padding:2px 6px; border-radius:6px; font-size:10px;">พร้อมกลับบ้าน</span>';

     // ปุ่มอัจฉริยะ (Smart Actions)
      let smartButtons = `
        <button class="btn-sm" onclick="printStickerAction('drug_bag', '${a.id}')">🛍️ พิมพ์หน้าถุงยา</button>
        <button class="btn-sm" onclick="printStickerAction('microchip_sticker', '${a.id}')">🏷️ สติกเกอร์ไมโครชิพ</button>
      `;
      if(hasVaccine) smartButtons += `<button class="btn-sm" onclick="printStickerAction('vaccine', '${a.id}')">📒 สมุดวัคซีน</button>`;
      if(hasMicrochip) smartButtons += `<button class="btn-sm" onclick="printStickerAction('microchip', '${a.id}')">💳 สมุดไมโครชิพ</button>`;
      
      const card = document.createElement("div");
      card.className = "rx-card";
      card.innerHTML = `
        <div class="card-header">
          <div class="q-circle">#${a.queue_number || "-"}</div>
          <div class="sc-title-block">
            <div class="sc-animal-name">${a.animal_name}</div>
            <div class="sc-meta">
              <span>เจ้าของ: ${ownerName}</span>
              <span>· นน.: ${a.actual_weight || "-"} kg</span>
              ${statusBadge}
            </div>
          </div>
        </div>
        <div class="rx-list-container">
          <div class="rx-list-title">รายการยาที่สั่งจ่าย</div>
          ${rxHtml}
          ${serviceHtml}
        </div>
        <div class="card-footer">
          <div class="card-actions">
             ${smartButtons}
          </div>
          <button class="btn btn-sky" onclick="printAllRx('${a.id}')">🖨️ พิมพ์สติกเกอร์ซองยาทั้งหมด</button>
          <button class="btn btn-emerald" onclick="markAsDone('${q.animal_id}', '${q.status}')">✅ จ่ายยาเรียบร้อย (กลับบ้าน)</button>
        </div>
      `;
      container.appendChild(card);
    });

  } catch (err) {
    console.error(err);
    container.innerHTML = `<div style="text-align:center; padding: 40px; color: #fca5a5;">❌ โหลดข้อมูลไม่สำเร็จ</div>`;
  }
}

// ==========================================
// ระบบแก้ไขรายการยา (Edit Rx)
// ==========================================
window.editRx = function(rxId) {
  document.getElementById(`rx-view-${rxId}`).style.display = 'none';
  document.getElementById(`rx-edit-${rxId}`).style.display = 'block';
  
  document.getElementById(`btn-print-${rxId}`).style.display = 'none';
  document.getElementById(`btn-edit-${rxId}`).style.display = 'none';
  document.getElementById(`btn-save-${rxId}`).style.display = 'block';
};

window.saveEditedRx = async function(rxId) {
  const btn = document.getElementById(`btn-save-${rxId}`);
  btn.innerText = "⏳...";
  btn.disabled = true;

  const newName = document.getElementById(`edit-name-${rxId}`).value.trim();
  const newDose = document.getElementById(`edit-dose-${rxId}`).value.trim();
  const newFreq = document.getElementById(`edit-freq-${rxId}`).value.trim();
  const newTotal = parseInt(document.getElementById(`edit-total-${rxId}`).value) || 0;
  const newDays = parseInt(document.getElementById(`edit-days-${rxId}`).value) || 0;

  try {
    const { error } = await supabase.from('vasd_prescription').update({
      drug_id: newName,
      dose: newDose,
      freq: newFreq,
      total_pills: newTotal,
      days: newDays
    }).eq("id", rxId);

    if (error) throw error;
    
    // โหลดหน้าจอใหม่เพื่อให้แสดงข้อมูลที่อัปเดตแล้ว
    loadRxQueue();
  } catch (err) {
    alert("❌ บันทึกไม่สำเร็จ: " + err.message);
    btn.innerText = "💾 บันทึก";
    btn.disabled = false;
  }
};


// ==========================================
// ระบบพิมพ์ Sticker จาก Template (รองรับรูปภาพ)
// ==========================================
async function renderStickers(templateType, dataArray) {
  const { data } = await supabase.from("vasd_print_template").select("config").eq("template_type", templateType).maybeSingle();
  const config = data?.config || [];

  if (config.length === 0) {
    alert("ยังไม่ได้ตั้งค่ารูปแบบสติกเกอร์สำหรับ: " + templateType + "\nกรุณาไปตั้งค่าในเมนู Designer Pro ก่อนครับ");
    return;
  }

  const dates = getDates();
  let htmlStr = "";

  dataArray.forEach(item => {
    htmlStr += `<div class="sticker">`;
    
    // ดึงค่าสำหรับการเช็คว่าเป็นแมวเพศผู้หรือไม่
    const isCat = (item.species === "ม" || item.species === "แมว");
    const isMale = (item.sex === "ผู้" || item.sex === "Male");

    // เตรียมไอคอนหมาแมว
    const spcImg = isCat 
      ? `<img src="./cat.png" style="height: 1em; width: auto; vertical-align: middle;">`
      : `<img src="./dog.png" style="height: 1em; width: auto; vertical-align: middle;">`;
    const sexImg = isMale
      ? `<img src="./male.png" style="height: 1em; width: auto; vertical-align: middle;">`
      : `<img src="./female.png" style="height: 1em; width: auto; vertical-align: middle;">`;
    const spcText = item.species === "ส" ? "สุนัข" : "แมว";

    // กำหนดข้อความแทนที่ตัวแปรตัดไหม
    let next7DaysText = dates.next;
    
    // [เพิ่มโค้ดที่นี่] ถ้าคลิกพิมพ์ถุงยา และเป็นแมวเพศผู้ ให้แสดง "ไม่ต้องตัดไหม"
    if (templateType === 'drug_bag' && isCat && isMale) {
      next7DaysText = "ไม่ต้องตัดไหม";
    }

    config.forEach(l => {
      const type = l.type || 'text';

      if (type === 'image') {
        // วาดรูปแบบ Image Base64
        htmlStr += `<div class="line" style="left:${l.x||0}px; top:${l.y||0}px;"><img src="${l.src}" style="width: ${l.width}px; height: ${l.height}px; object-fit: contain;"></div>`;
      } else {
        // แทนค่าตัวแปรทั้งหมด (โหมด Text)
        let txt = (l.text || "")
          .replace(/{{queue_number}}/g, item.queue_number || "")
          .replace(/{{animal_name}}/g, item.animal_name || "")
          .replace(/{{species}}/g, spcText)
          .replace(/{{species_icon}}/g, spcImg)
          .replace(/{{sex}}/g, item.sex || "")
          .replace(/{{sex_icon}}/g, sexImg)
          .replace(/{{owner_name}}/g, item.owner_name || "")
          .replace(/{{id_card}}/g, item.id_card || "")
          .replace(/{{address}}/g, item.address || "")
          .replace(/{{phone}}/g, item.phone || "")
          .replace(/{{drug_name}}/g, item.drug_name || "")
          .replace(/{{dose}}/g, item.dose || "")
          .replace(/{{freq}}/g, item.freq || "")
          .replace(/{{total_amount}}/g, item.total_amount || "")
          .replace(/{{todayDate}}/g, dates.today)
          .replace(/{{next7days}}/g, next7DaysText); // ใช้ข้อความตามที่ตรวจสอบจากเงื่อนไข

        htmlStr += `<div class="line" style="left:${l.x||0}px; top:${l.y||0}px; font-size:${l.size||12}px; text-align:${l.align||'left'}; font-family:'${l.font||'Sarabun'}', sans-serif; font-weight:${l.bold?'600':'400'}; width:${l.align==='center'?'100%':`calc(100% - ${l.x||0}px)`}; ${l.align==='center'?'left:0px;':''}">${txt}</div>`;
      }
    });
    htmlStr += `</div>`;
  });

  const pw = window.open("","_blank","width=800,height=600");
  pw.document.write(`<html><head><style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Sarabun:wght@400;600&family=Prompt:wght@400;600&family=Kanit:wght@400;600&display=swap');
    body{margin:0; background:#e2e8f0; display:flex; flex-direction:column; align-items:center; padding:20px;}
    .sticker{position:relative; width:80mm; height:50mm; background:#fff; overflow:hidden; margin-bottom: 20px; box-shadow:0 4px 10px rgba(0,0,0,0.1); page-break-after:always;}
    .line{position:absolute; white-space:pre-wrap; word-break:break-word; color:#000; line-height:1.2;}
    @page{size:80mm 50mm; margin:0;}
    @media print { body{background:#fff; padding:0;} .sticker{margin:0; box-shadow:none;} }
  </style></head><body>${htmlStr}
  <script>
    window.onload=function(){
      setTimeout(function(){
        window.print();
        window.close();
      }, 500);
    };
  <\/script></body></html>`);
  pw.document.close();
}

// เตรียม Data สำหรับพิมพ์ตามประเภท (สมุดวัคซีน, ไมโครชิพ, ถุงยา)
window.printStickerAction = (type, animalId) => {
  const a = window.rxDataMap[animalId];
  if (!a) return;
  const baseData = {
    queue_number: a.queue_number, animal_name: a.animal_name, species: a.species, sex: a.sex,
    owner_name: a.vasd_owner?.owner_name, id_card: a.vasd_owner?.id_card, address: a.vasd_owner?.address, phone: a.vasd_owner?.phone
  };
  renderStickers(type, [baseData]);
};

// พิมพ์ยาทั้งหมด (วนลูปตามจำนวนรายการยา)
window.printAllRx = (animalId) => {
  const a = window.rxDataMap[animalId];
  if (!a || !a.vasd_prescription || a.vasd_prescription.length === 0) return alert("ไม่มีรายการยา");
  
  const drugsData = a.vasd_prescription.map(rx => ({
    queue_number: a.queue_number, animal_name: a.animal_name, species: a.species, sex: a.sex,
    owner_name: a.vasd_owner?.owner_name, id_card: a.vasd_owner?.id_card, address: a.vasd_owner?.address, phone: a.vasd_owner?.phone,
    drug_name: rx.drug_id, dose: rx.dose, freq: rx.freq, total_amount: rx.total_pills + " เม็ด"
  }));
  // เรียก Template ชื่อ drug_envelope
  renderStickers('drug_envelope', drugsData);
};

// พิมพ์ยาเฉพาะตัวที่เลือก
window.printSingleRx = (animalId, rxIndex) => {
  const a = window.rxDataMap[animalId];
  if (!a || !a.vasd_prescription || !a.vasd_prescription[rxIndex]) return;
  const rx = a.vasd_prescription[rxIndex];
  
  const drugData = {
    queue_number: a.queue_number, animal_name: a.animal_name, species: a.species, sex: a.sex,
    owner_name: a.vasd_owner?.owner_name, id_card: a.vasd_owner?.id_card, address: a.vasd_owner?.address, phone: a.vasd_owner?.phone,
    drug_name: rx.drug_id, dose: rx.dose, freq: rx.freq, total_amount: rx.total_pills + " เม็ด"
  };
  renderStickers('drug_envelope', [drugData]);
};

// ฟังก์ชันอัปเดตสถานะให้เสร็จสิ้น (Done)
window.markAsDone = async function(animalId, currentStatus) {
  if (currentStatus !== 'ready_to_go_home') {
    if (!confirm("⚠️ สัตว์ตัวนี้ยังอยู่ในขั้นตอนผ่าตัด/พักฟื้น แน่ใจหรือไม่ที่จะปิดเคสและให้กลับบ้านตอนนี้?")) return;
  } else {
    if (!confirm("คุณได้ทำการจัดยาและอธิบายวิธีใช้เรียบร้อยแล้ว ยืนยันให้สัตว์กลับบ้าน?")) return;
  }
  
  try {
    const { error } = await supabase.from("vasd_queue").update({ 
      status: "done", 
      updated_at: new Date() 
    }).eq("animal_id", animalId);
    if (error) throw error;
  } catch (err) {
    alert("เกิดข้อผิดพลาด: " + err.message);
  }
};

// Realtime Update เฝ้าดูการเปลี่ยนแปลงของคิว, ยา และบริการ
supabase.channel('rx-realtime')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'vasd_queue' }, loadRxQueue)
  .on('postgres_changes', { event: '*', schema: 'public', table: 'vasd_prescription' }, loadRxQueue)
  .on('postgres_changes', { event: '*', schema: 'public', table: 'vasd_service' }, loadRxQueue)
  .subscribe();

loadRxQueue();
</script>
