<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ติดตามสถานะสัตว์เลี้ยง – VASD</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800;900&family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Script สำหรับเช็ค Theme ก่อนเรนเดอร์หน้าเว็บเพื่อป้องกันการกระพริบ (FOUC) -->
<script>
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'light' || (!savedTheme && window.matchMedia('(prefers-color-scheme: light)').matches)) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
</script>

<style>
/* ═══════════════════════════════════════════
   TOKENS & THEME (Dark Mode - Default)
═══════════════════════════════════════════ */
:root {
  --navy:         #0b1929;
  --text:         #f8fafc;
  --text-dark:    #064e3b;
  --text-dim:     #cbd5e1;
  --surface:      rgba(255,255,255,0.1);
  --border:       rgba(255,255,255,0.2);
  --header-bg:    rgba(11, 25, 41, 0.85);
  
  /* Status Gradients */
  --g-wait:       linear-gradient(135deg, #94a3b8 0%, #64748b 100%);
  --g-anes:       linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
  --g-surg:       linear-gradient(135deg, #f87171 0%, #dc2626 100%);
  --g-rec:        linear-gradient(135deg, #a7f3d0 0%, #34d399 100%);
  --g-ready:      linear-gradient(135deg, #10b981 0%, #047857 100%);
}

/* ═══════════════════════════════════════════
   LIGHT THEME TOKENS
═══════════════════════════════════════════ */
[data-theme="light"] {
  --navy:         #f8fafc;
  --text:         #0f172a;
  --text-dim:     #475569;
  --surface:      #ffffff;
  --border:       #cbd5e1;
  --header-bg:    rgba(255, 255, 255, 0.9);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Sarabun", sans-serif;
  background: var(--navy);
  color: var(--text);
  min-height: 100vh;
  display: flex; flex-direction: column;
  overflow-x: hidden;
  padding-bottom: 40px;
  transition: background-color 0.3s ease, color 0.3s ease;
}
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1;
  background: radial-gradient(circle at 50% -20%, rgba(14,165,160,0.15) 0%, transparent 70%);
  transition: opacity 0.3s ease;
}
[data-theme="light"] body::before {
  background: radial-gradient(circle at 50% -20%, rgba(14,165,160,0.05) 0%, transparent 70%);
}

/* ═══════════════════════════════════════════
   HEADER (Stats & Glassmorphism)
═══════════════════════════════════════════ */
header {
  position: sticky; top: 0; z-index: 100;
  background: var(--header-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: clamp(10px, 1.5vw, 20px) 24px;
  display: flex; align-items: center; justify-content: space-between; gap: 20px;
  flex-wrap: wrap;
  box-shadow: 0 4px 30px rgba(0,0,0,0.1);
  transition: background-color 0.3s ease, border-color 0.3s ease;
}

.stats-header {
  display: flex; gap: clamp(8px, 1vw, 16px); flex-wrap: wrap; align-items: center; flex: 1;
}
.stat-pill {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 8px 16px; border-radius: 50px;
  font-weight: 600; font-size: clamp(13px, 1.5vw, 18px);
  color: var(--text);
  display: flex; align-items: center; gap: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  transition: background-color 0.3s, border-color 0.3s, color 0.3s;
}
.stat-pill span {
  font-family: "Outfit", sans-serif;
  font-weight: 800; font-size: 1.1em;
}
.stat-pill.highlight {
  background: linear-gradient(135deg, #0ea5a0, #14c4bc);
  color: #fff; border: none;
}

.header-actions {
  display: flex; align-items: center; gap: 16px;
}
.live-indicator {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  font-size: clamp(12px, 1.5vw, 16px); font-weight: 700; color: var(--text-dim);
  background: var(--surface); padding: 8px 16px; border-radius: 50px;
  border: 1px solid var(--border);
}
.live-dot {
  width: 10px; height: 10px; 
  background: #34d399; border-radius: 50%;
  animation: pulseDot 2s infinite;
}

/* Theme Toggle */
.btn-theme {
  background: var(--surface); border: 1px solid var(--border); color: var(--text);
  width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 18px; transition: background 0.2s, transform 0.2s;
}
.btn-theme:hover { transform: scale(1.05); }
.btn-theme:active { transform: scale(0.95); }
.icon-sun { display: none; }
[data-theme="light"] .icon-moon { display: none; }
[data-theme="light"] .icon-sun { display: inline-block; }

/* ═══════════════════════════════════════════
   MAIN GRID (Auto Responsive)
═══════════════════════════════════════════ */
.wrap { 
  padding: clamp(16px, 3vw, 40px); 
  width: 100%; 
  max-width: 1920px; 
  margin: 0 auto; 
}

#animalList {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(clamp(140px, 20vw, 280px), 1fr));
  gap: clamp(12px, 2vw, 32px); 
}

/* การ์ดสี่เหลี่ยม */
.pet-card {
  aspect-ratio: 1; 
  border-radius: clamp(16px, 2vw, 32px);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: clamp(10px, 2vw, 24px);
  text-align: center;
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
  transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s;
  border: 1px solid rgba(255,255,255,0.1);
  view-transition-name: card-var(--id); 
}
[data-theme="light"] .pet-card { border: none; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
.pet-card:hover { transform: translateY(-5px) scale(1.02); box-shadow: 0 15px 35px rgba(0,0,0,0.25); }

.pet-card .q-num {
  font-family: "Outfit", sans-serif;
  font-size: clamp(32px, 6vw, 80px); 
  font-weight: 900; line-height: 1;
  margin-bottom: clamp(4px, 1vw, 12px);
  text-shadow: 0 2px 10px rgba(0,0,0,0.15);
}
.pet-card .name {
  font-size: clamp(14px, 2.5vw, 28px); font-weight: 700;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  width: 100%; margin-bottom: clamp(6px, 1.5vw, 16px);
}
.pet-card .status {
  font-size: clamp(12px, 2vw, 24px); font-weight: 700;
  background: rgba(255,255,255,0.25);
  backdrop-filter: blur(5px);
  padding: clamp(4px, 1vw, 8px) clamp(10px, 2vw, 20px); 
  border-radius: 50px;
  white-space: nowrap; width: max-content; max-width: 100%; 
  overflow: hidden; text-overflow: ellipsis;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

/* ═══════════════════════════════════════════
   COLORS CLASSES
═══════════════════════════════════════════ */
.bg-wait  { background: var(--g-wait); color: #fff; }
.bg-anes  { background: var(--g-anes); color: #fff; }
.bg-surg  { background: var(--g-surg); color: #fff; }
.bg-ready { background: var(--g-ready); color: #fff; }
.bg-rec   { background: var(--g-rec); color: var(--text-dark); } 
.bg-rec .status { background: rgba(0,0,0,0.08); }

.empty-state {
  grid-column: 1 / -1; text-align: center; padding: 10vh 20px; color: var(--text-dim);
  font-size: clamp(18px, 3vw, 32px); font-weight: 600;
}

/* ═══════════════════════════════════════════
   FULLSCREEN POPUP ANIMATION (TV Ready)
═══════════════════════════════════════════ */
#popupOverlay {
  position: fixed; inset: 0; z-index: 9999;
  background: rgba(11,25,41,0.85);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.4s ease, background-color 0.3s;
}
[data-theme="light"] #popupOverlay { background: rgba(255,255,255,0.85); }
#popupOverlay.active { opacity: 1; pointer-events: auto; }

.popup-box {
  width: min(80vw, 600px); aspect-ratio: 1;
  border-radius: clamp(30px, 5vw, 60px);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 32px;
  box-shadow: 0 30px 60px rgba(0,0,0,0.4), inset 0 2px 10px rgba(255,255,255,0.3);
  transform: scale(0.5) translateY(50px);
  transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}
#popupOverlay.active .popup-box { transform: scale(1) translateY(0); }

.popup-box .q-num { font-family: "Outfit", sans-serif; font-size: clamp(80px, 15vw, 200px); font-weight: 900; line-height: 1; margin-bottom: 20px; text-shadow: 0 10px 30px rgba(0,0,0,0.2);}
.popup-box .name { font-size: clamp(30px, 5vw, 56px); font-weight: 800; margin-bottom: 24px; }
.popup-box .status { font-size: clamp(24px, 4vw, 42px); font-weight: 700; background: rgba(255,255,255,0.3); padding: 12px 32px; border-radius: 50px; }

@keyframes pulseDot {
  0% { box-shadow: 0 0 0 0 rgba(52,211,153,0.7); }
  70% { box-shadow: 0 0 0 clamp(6px, 1vw, 12px) rgba(52,211,153,0); }
  100% { box-shadow: 0 0 0 0 rgba(52,211,153,0); }
}

/* ตั้งค่าให้ View Transition นุ่มนวลขึ้น */
::view-transition-group(*) { animation-duration: 0.5s; animation-timing-function: cubic-bezier(0.25, 1, 0.5, 1); }

@media (max-width: 768px) {
  .stats-header { justify-content: center; }
  .header-actions { width: 100%; justify-content: space-between; margin-top: 10px; }
}
</style>
</head>
<body>

<header>
  <div class="stats-header">
    <div class="stat-pill">🐶 สุนัข เมีย <span id="h-dog-f">0</span></div>
    <div class="stat-pill">🐶 สุนัข ผู้ <span id="h-dog-m">0</span></div>
    <div class="stat-pill">🐱 แมว เมีย <span id="h-cat-f">0</span></div>
    <div class="stat-pill">🐱 แมว ผู้ <span id="h-cat-m">0</span></div>
    <div class="stat-pill highlight">รวมทั้งหมด <span id="h-total">0</span></div>
  </div>
  
  <div class="header-actions">
    <div class="live-indicator"><div class="live-dot"></div> Real-Time</div>
    <!-- ปุ่ม Toggle สลับ Theme -->
    <button id="themeToggle" class="btn-theme" title="สลับโหมดมืด/สว่าง">
      <span class="icon-moon">🌙</span>
      <span class="icon-sun">☀️</span>
    </button>
  </div>
</header>

<div class="wrap">
  <div id="animalList">
    <div class="empty-state" id="emptyState">กำลังโหลดข้อมูลคิว...</div>
  </div>
</div>

<div id="popupOverlay">
  <div class="popup-box" id="popupBox">
    <div class="q-num" id="popupQ">#0</div>
    <div class="name" id="popupName">ชื่อสัตว์</div>
    <div class="status" id="popupStatus">สถานะ</div>
  </div>
</div>

<script>
  /* ── Theme Switcher Logic ── */
  const themeToggleBtn = document.getElementById('themeToggle');
  if (themeToggleBtn) {
    themeToggleBtn.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      if (currentTheme === 'light') {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('theme', 'dark');
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        localStorage.setItem('theme', 'light');
      }
    });
  }
</script>

<script type="module">
import { supabase } from "./js/supabase.js";

let isFirstLoad = true;
let oldStatuses = {}; 

let popupQueue = [];
let isPopupShowing = false;

// กรองสถานะและตั้งชื่อให้ตรงกับความต้องการ
const statusMap = {
  recovery:         { text: "พักฟื้น",       colorClass: "bg-rec",   weight: 1 },
  surgery:          { text: "กำลังผ่าตัด",   colorClass: "bg-surg",  weight: 2 },
  anesthesia:       { text: "รอวางยา",       colorClass: "bg-anes",  weight: 3 },
  waiting:          { text: "รอวางยา",       colorClass: "bg-wait",  weight: 4 }
};

// กำหนดสถานะที่อนุญาตให้แสดงบนหน้าจอ
const allowedStatuses = ["waiting", "anesthesia", "surgery", "recovery"];

async function loadAnimals() {
  // ดึง species และ sex มาเพื่อคำนวณสรุปยอดด้วย
  const { data, error } = await supabase
    .from("vasd_animal")
    .select(`id, queue_number, animal_name, species, sex, vasd_queue(status)`);

  if (error) {
    console.error("Database Fetch Error:", error);
    document.getElementById("animalList").innerHTML = `<div class="empty-state">เกิดข้อผิดพลาดในการโหลดข้อมูลคิว</div>`;
    return;
  }
  
  const formattedData = data || [];
  
  // ── คำนวณสรุปยอดสัตว์ทั้งหมด (Dashboard Header) ──
  let dogF = 0, dogM = 0, catF = 0, catM = 0;
  formattedData.forEach(a => {
    if (a.species === 'ส' && a.sex === 'เมีย') dogF++;
    else if (a.species === 'ส' && a.sex === 'ผู้') dogM++;
    else if (a.species === 'ม' && a.sex === 'เมีย') catF++;
    else if (a.species === 'ม' && a.sex === 'ผู้') catM++;
  });
  
  document.getElementById('h-dog-f').textContent = dogF;
  document.getElementById('h-dog-m').textContent = dogM;
  document.getElementById('h-cat-f').textContent = catF;
  document.getElementById('h-cat-m').textContent = catM;
  document.getElementById('h-total').textContent = formattedData.length;

  // ── จัดเรียงลำดับการ์ด ──
  formattedData.sort((a, b) => {
    const qDataA = Array.isArray(a.vasd_queue) ? a.vasd_queue[0] : a.vasd_queue;
    const qDataB = Array.isArray(b.vasd_queue) ? b.vasd_queue[0] : b.vasd_queue;
    const statA = qDataA?.status || "waiting";
    const statB = qDataB?.status || "waiting";
    
    const wA = statusMap[statA]?.weight || 99;
    const wB = statusMap[statB]?.weight || 99;
    if (wA !== wB) return wA - wB;
    return a.queue_number - b.queue_number;
  });

  renderGrid(formattedData);
}

function renderGrid(data) {
  const list = document.getElementById("animalList");
  
  // กรองแสดงเฉพาะสถานะที่อยู่ใน allowedStatuses เท่านั้น
  const activeData = data.filter(a => {
    const qData = Array.isArray(a.vasd_queue) ? a.vasd_queue[0] : a.vasd_queue;
    const status = qData?.status || "waiting";
    return allowedStatuses.includes(status);
  });

  let htmlContent = "";

  if (activeData.length === 0) {
    htmlContent = `<div class="empty-state">ยังไม่มีรายการคิวในขณะนี้</div>`;
  } else {
    activeData.forEach(a => {
      const qData = Array.isArray(a.vasd_queue) ? a.vasd_queue[0] : a.vasd_queue;
      const newStatus = qData?.status || "waiting";
      const s = statusMap[newStatus] || statusMap.waiting;
      
      if (!isFirstLoad && oldStatuses[a.id] && oldStatuses[a.id] !== newStatus) {
        enqueuePopup({
          queue: a.queue_number,
          name: a.animal_name,
          text: s.text,
          colorClass: s.colorClass
        });
      }
      oldStatuses[a.id] = newStatus; 

      // ใส่ style view-transition-name เพื่อให้การ์ดลอยสลับตำแหน่งได้ (เฉพาะเบราว์เซอร์ที่รองรับ)
      htmlContent += `
        <div class="pet-card ${s.colorClass}" style="view-transition-name: card-${a.id};">
          <div class="q-num">#${a.queue_number}</div>
          <div class="name">${a.animal_name || "ไม่ระบุ"}</div>
          <div class="status">${s.text}</div>
        </div>
      `;
    });
  }

  // 🪄 ใช้ View Transitions API เพื่อสร้างแอนิเมชันเวลาคิวขยับสลับตำแหน่ง
  if (!isFirstLoad && document.startViewTransition) {
    document.startViewTransition(() => {
      list.innerHTML = htmlContent;
    });
  } else {
    list.innerHTML = htmlContent;
  }
  
  isFirstLoad = false;
}

function enqueuePopup(animalData) {
  popupQueue.push(animalData);
  processPopupQueue();
}

function processPopupQueue() {
  if (isPopupShowing || popupQueue.length === 0) return;
  isPopupShowing = true;
  
  const target = popupQueue.shift();
  const overlay = document.getElementById("popupOverlay");
  const box = document.getElementById("popupBox");
  
  document.getElementById("popupQ").textContent = `#${target.queue}`;
  document.getElementById("popupName").textContent = target.name || "ไม่ระบุชื่อ";
  document.getElementById("popupStatus").textContent = target.text;
  
  box.className = `popup-box ${target.colorClass}`;
  
  overlay.classList.add("active");
  
  setTimeout(() => {
    overlay.classList.remove("active");
    setTimeout(() => {
      isPopupShowing = false;
      processPopupQueue();
    }, 400); // เผื่อเวลาให้ Animation CSS หดกลับเสร็จ
  }, 4000); // ให้อยู่บนจอนานขึ้นนิดนึง (4 วินาที) เผื่อจอทีวีคนมองไม่ทัน
}

supabase.channel("vasd-customer-live")
  .on("postgres_changes", { event: "*", schema: "public", table: "vasd_queue" }, loadAnimals)
  .on("postgres_changes", { event: "*", schema: "public", table: "vasd_animal" }, loadAnimals)
  .subscribe();

loadAnimals();
</script>

</body>
</html>
