<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ผลเลือด (CBC) – VASD</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════════
   TOKENS & BASE
═══════════════════════════════════════════ */
:root {
  --navy:         #0b1929;
  --navy-mid:     #112240;
  --teal:         #0ea5a0;
  --teal-light:   #14c4bc;
  --teal-glow:    rgba(14,165,160,0.25);
  --rose:         #ef4444;
  --rose-soft:    rgba(239,68,68,0.12);
  --blue:         #3b82f6;
  --blue-light:   #93c5fd;

  --surface:      rgba(255,255,255,0.04);
  --surface-2:    rgba(255,255,255,0.07);
  --border:       rgba(255,255,255,0.08);
  --border-2:     rgba(255,255,255,0.14);
  --text:         #e2e8f0;
  --text-dim:     #94a3b8;

  --radius-sm:    10px;
  --radius:       16px;
  --radius-lg:    22px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Sarabun", sans-serif;
  background: var(--navy);
  color: var(--text);
  min-height: 100vh;
  display: flex; flex-direction: column;
}
body::before {
  content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(ellipse 60% 50% at 50% 10%, rgba(59,130,246,0.10) 0%, transparent 70%);
}

/* ═══════════════════════════════════════════
   HEADER & WRAP
═══════════════════════════════════════════ */
header {
  position: sticky; top: 0; z-index: 200;
  background: rgba(11,25,41,0.88); backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 0 20px; height: 64px;
  display: flex; align-items: center; justify-content: space-between;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-logo {
  width: 38px; height: 38px;
  background: linear-gradient(135deg, var(--blue), #60a5fa);
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
  font-size: 18px; box-shadow: 0 0 20px rgba(59,130,246,0.25);
}
.brand-name { font-family: "Outfit", sans-serif; font-size: 15px; font-weight: 700; color: #fff; }

.btn-back {
  padding: 8px 14px; font-size: 13px; font-weight: 600; font-family: "Sarabun", sans-serif;
  background: var(--surface-2); color: var(--text-dim);
  border: 1px solid var(--border-2); border-radius: var(--radius-sm); cursor: pointer;
  transition: 0.2s;
}
.btn-back:hover { background: var(--surface-3); color: var(--text); }

.wrap {
  position: relative; z-index: 1;
  max-width: 800px; margin: 0 auto; padding: 24px 16px 80px; width: 100%;
}

/* ═══════════════════════════════════════════
   CARD & FORM
═══════════════════════════════════════════ */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); overflow: hidden;
  animation: slideUp 0.3s ease both;
}
.card-header {
  padding: 16px 20px; background: var(--surface-2); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 15px;
}
.q-badge {
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--blue); color: #fff; font-family: "Outfit", sans-serif;
  font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center;
}
.info-block { flex: 1; }
.info-name { font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 4px; }
.info-meta { font-size: 13px; color: var(--text-dim); }

.card-body { padding: 20px; }

.field-label {
  display: block; font-size: 12px; font-weight: 700; color: var(--text-dim);
  text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;
}
textarea.blood-input {
  width: 100%; min-height: 250px; padding: 16px;
  background: rgba(0,0,0,0.2); border: 1px solid var(--border-2);
  border-radius: var(--radius-sm); color: var(--text);
  font-family: "Sarabun", "Courier New", monospace; font-size: 15px; line-height: 1.6;
  outline: none; transition: border-color 0.2s; resize: vertical;
}
textarea.blood-input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }

/* ═══════════════════════════════════════════
   BUTTONS
═══════════════════════════════════════════ */
.action-row {
  display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap;
}
.btn {
  padding: 14px 20px; font-size: 15px; font-weight: 600; font-family: "Sarabun", sans-serif;
  border: none; border-radius: var(--radius-sm); cursor: pointer; flex: 1;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: 0.2s;
}
.btn:active { transform: scale(0.96); }
.btn-save {
  background: linear-gradient(135deg, var(--teal), var(--teal-light)); color: #fff;
  box-shadow: 0 4px 15px var(--teal-glow);
}
.btn-save:hover { filter: brightness(1.1); }
.btn-print {
  background: rgba(59,130,246,0.15); color: var(--blue-light);
  border: 1px solid rgba(59,130,246,0.3);
}
.btn-print:hover { background: rgba(59,130,246,0.25); }

@keyframes slideUp {
  from { opacity: 0; transform: translateY(15px); }
  to   { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-logo">🩸</div>
    <div class="brand-name">บันทึกผลเลือด (CBC)</div>
  </div>
  <button class="btn-back" onclick="window.history.back()">🔙 กลับ</button>
</header>

<div class="wrap">
  <div class="card">
    <div class="card-header">
      <div class="q-badge" id="ui-queue">...</div>
      <div class="info-block">
        <div class="info-name" id="ui-name">กำลังโหลด...</div>
        <div class="info-meta" id="ui-meta">กรุณารอสักครู่</div>
      </div>
    </div>
    
    <div class="card-body">
      <label class="field-label">วางผลตรวจ CBC (ข้อความ)</label>
      <textarea id="cbcText" class="blood-input" placeholder="ตัวอย่าง:
RBC: 5.5
WBC: 12.0
HCT: 35%
PLT: 350,000"></textarea>
      
      <div class="action-row">
        <button class="btn btn-print" onclick="printBlood()">🖨 พิมพ์ผลเลือด</button>
        <button class="btn btn-save" id="btnSave" onclick="saveBlood()">💾 บันทึกข้อมูล</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { supabase } from "./js/supabase.js";

// อ่านค่า animal_id จาก URL (?id=...)
const urlParams = new URLSearchParams(window.location.search);
const animalId = urlParams.get('id');

let animalData = null;
let existingBloodId = null;

async function loadData() {
  if (!animalId) {
    alert("ไม่พบรหัสสัตว์ในระบบ (Missing ID)");
    return;
  }

  try {
    // 1. ดึงข้อมูลสัตว์ (ดึง address, phone, id_card เผื่อไว้ใช้ใน Template ด้วย)
    const { data: a, error: errA } = await supabase
      .from('vasd_animal')
      .select('queue_number, animal_name, species, sex, vasd_owner(owner_name, phone, address, id_card)')
      .eq('id', animalId)
      .single();

    if (errA || !a) throw errA || new Error("ไม่พบข้อมูลสัตว์");
    animalData = a;

    // อัปเดต UI ส่วนหัว
    document.getElementById("ui-queue").textContent = `#${a.queue_number}`;
    document.getElementById("ui-name").textContent = a.animal_name;
    const speciesTxt = a.species === 'ส' ? 'สุนัข' : 'แมว';
    const ownerTxt = a.vasd_owner?.owner_name || 'ไม่ระบุ';
    document.getElementById("ui-meta").textContent = `${speciesTxt} · ${a.sex} | เจ้าของ: ${ownerTxt}`;

    // 2. ดึงข้อมูลผลเลือด (ถ้ามี)
    const { data: b, error: errB } = await supabase
      .from('vasd_blood_test')
      .select('id, cbc_text')
      .eq('animal_id', animalId)
      .order('created_at', { ascending: false })
      .limit(1)
      .maybeSingle(); 

    if (b) {
      existingBloodId = b.id;
      document.getElementById("cbcText").value = b.cbc_text || "";
    }

  } catch (error) {
    console.error(error);
    document.getElementById("ui-name").textContent = "❌ ไม่สามารถโหลดข้อมูลได้";
    document.getElementById("ui-meta").textContent = error.message;
  }
}

// ฟังก์ชันบันทึก
window.saveBlood = async function() {
  const btn = document.getElementById("btnSave");
  const text = document.getElementById("cbcText").value.trim();

  try {
    btn.disabled = true;
    btn.innerHTML = "⏳ กำลังบันทึก...";

    if (existingBloodId) {
      // อัปเดตของเดิม
      const { error } = await supabase
        .from('vasd_blood_test')
        .update({ cbc_text: text })
        .eq('id', existingBloodId);
      if (error) throw error;
    } else {
      // สร้างใหม่
      const { data, error } = await supabase
        .from('vasd_blood_test')
        .insert({ animal_id: animalId, cbc_text: text })
        .select('id')
        .single();
      if (error) throw error;
      existingBloodId = data.id; // เก็บ ID ไว้เผื่อกดเซฟซ้ำ
    }

    alert("✅ บันทึกผลเลือดเรียบร้อยแล้ว");
  } catch (error) {
    console.error(error);
    alert("❌ บันทึกไม่สำเร็จ: " + error.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = "💾 บันทึกข้อมูล";
  }
};

// ฟังก์ชันพิมพ์ผลเลือดโดยดึงจาก Template
window.printBlood = async function() {
  const text = document.getElementById("cbcText").value.trim();
  if (!text) return alert("โปรดกรอกผลเลือดก่อนทำการพิมพ์");
  
  if (!animalData) return;

  // 1. ดึง Template การพิมพ์ของ CBC
  const { data: tmplData, error } = await supabase
    .from("vasd_print_template")
    .select("config")
    .eq("template_type", "cbc")
    .maybeSingle();

  if (error || !tmplData?.config || tmplData.config.length === 0) {
    alert("⚠️ ยังไม่ได้ตั้งค่ารูปแบบสติกเกอร์สำหรับผลเลือด (CBC)\nกรุณาไปตั้งค่าในเมนู Designer Pro ก่อนครับ");
    return;
  }

  // 2. เตรียมข้อมูลตัวแปรสำหรับ Replace
  const spcText  = animalData.species === "ส" ? "สุนัข" : "แมว";
  const phone    = animalData.vasd_owner?.phone || "-";
  const address  = animalData.vasd_owner?.address || "-";
  const idCard   = animalData.vasd_owner?.id_card || "-";
  const ownerName= animalData.vasd_owner?.owner_name || "-";

  const spcImg = (animalData.species === "ม" || animalData.species === "แมว") 
    ? `<img src="./cat.png" style="height: 1em; width: auto; vertical-align: middle;">`
    : `<img src="./dog.png" style="height: 1em; width: auto; vertical-align: middle;">`;

  const sexImg = (animalData.sex === "ผู้" || animalData.sex === "Male")
    ? `<img src="./male.png" style="height: 1em; width: auto; vertical-align: middle;">`
    : `<img src="./female.png" style="height: 1em; width: auto; vertical-align: middle;">`;

  const now = new Date();
  const next7 = new Date(); next7.setDate(now.getDate() + 7);
  const options = { day: 'numeric', month: 'long', year: 'numeric' };
  const todayDate = now.toLocaleDateString('th-TH', options);
  const next7days = next7.toLocaleDateString('th-TH', options);

  // 3. ประกอบข้อความ HTML จาก Template
  let printContents = "";
  tmplData.config.forEach(l => {
    const type = l.type || 'text';

    if (type === 'image') {
      printContents += `<div class="line" style="left:${l.x||0}px;top:${l.y||0}px;"><img src="${l.src}" style="width: ${l.width}px; height: ${l.height}px; object-fit: contain;"></div>`;
    } else {
      let txt = (l.text || "")
        .replace(/{{queue_number}}/g, animalData.queue_number || "")
        .replace(/{{animal_name}}/g, animalData.animal_name || "")
        .replace(/{{species}}/g, spcText)
        .replace(/{{species_icon}}/g, spcImg)  
        .replace(/{{sex}}/g, animalData.sex || "")
        .replace(/{{sex_icon}}/g, sexImg)      
        .replace(/{{owner_name}}/g, ownerName)
        .replace(/{{id_card}}/g, idCard)
        .replace(/{{address}}/g, address)
        .replace(/{{phone}}/g, phone)
        .replace(/{{cbc_text}}/g, text)
        .replace(/{{todayDate}}/g, todayDate)
        .replace(/{{next7days}}/g, next7days);
      
      printContents += `<div class="line" style="left:${l.x||0}px;right:0;top:${l.y||0}px;font-size:${l.size}px;font-weight:${l.bold ? "600" : "400"};font-family:${l.font||"Sarabun"};text-align:${l.align||"left"};">${txt}</div>`;
    }
  });

  // 4. สร้างหน้าต่างปริ้นใหม่
  const pw = window.open("", "_blank", "width=800,height=600");
  pw.document.write(`
    <html>
      <head>
        <title>Print CBC</title>
        <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Kanit:wght@400;700&family=Prompt:wght@400;700&family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
        <style>
          body { margin: 0; background: #fff; }
          .sticker { position: relative; width: 80mm; height: 50mm; background: #fff; overflow: hidden; }
          .line { position: absolute; white-space: pre-wrap; word-break: break-word; padding-right: 5px; box-sizing: border-box; color: #000 !important; line-height: 1.2; }
          @page { size: 80mm 50mm; margin: 0; }
        </style>
      </head>
      <body>
        <div class="sticker">${printContents}</div>
        <script>
          window.onload = function() {
            document.fonts.ready.then(() => {
              setTimeout(() => {
                window.print();
                window.close();
              }, 500);
            });
          }
        <\/script>
      </body>
    </html>
  `);
  pw.document.close();
};

// เริ่มต้นทำงาน
loadData();
</script>
</body>
</html>
